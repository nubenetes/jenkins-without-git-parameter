# ==============================================================================
# ArgoCD ApplicationSet: Multi-Cluster Environment Generator
# Deploys applications across DEV, STAGING, and PROD clusters automatically
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: multicluster-workloads
  namespace: argocd
spec:
  generators:
    # Cluster Generator: Discovers registered OpenShift clusters by environment label
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: "jhipster-microservice-{{metadata.labels.environment}}"
      namespace: argocd
      labels:
        environment: "{{metadata.labels.environment}}"
        app.kubernetes.io/managed-by: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/nubenetes/jenkins-without-git-parameter.git
        targetRevision: main
        path: "sample-apps/jhipster-microservice/k8s/overlays/{{metadata.labels.environment}}"
      destination:
        server: "{{server}}"
        namespace: "nubenetes-{{metadata.labels.environment}}-apps"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
