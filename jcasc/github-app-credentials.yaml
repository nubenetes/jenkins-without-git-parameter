# ==============================================================================
# JCasC Credentials: GitHub App Authentication for SCM & GitOps Promotion PRs
# ==============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          - gitHubApp:
              id: "github-app-gitops"
              description: "GitHub App for Multibranch SCM Discovery & Automated GitOps PRs"
              appID: "${GITHUB_APP_ID:-123456}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY:-}"
          - usernamePassword:
              id: "openshift-registry-credentials"
              description: "OpenShift Internal Image Registry ServiceAccount Token"
              username: "serviceaccount"
              password: "${OPENSHIFT_REGISTRY_TOKEN:-}"
              scope: GLOBAL
          - string:
              id: "cosign-private-key-password"
              description: "Cosign Key Password for Container Signing"
              secret: "${COSIGN_PASSWORD:-}"
              scope: GLOBAL
